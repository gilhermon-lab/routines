name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # מפתח חתימה קבוע — בלעדיו כל בנייה היא אפליקציה אחרת מבחינת אנדרואיד,
      # ואז כל התקנה דורשת הסרה ומאבדת הגדרות והרשאות.
      - name: Restore keystore
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "אין מפתח חתימה — נבנה בילד debug לא חתום"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build stamp
        run: echo "BUILD_STAMP=$(date -u +%d/%m\ %H:%M) ${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Build signed release
        if: steps.ks.outputs.signed == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace --info 2>&1 | tail -120
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -eq 0 ] && [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk routines.apk
          else
            echo "::warning::בניית release נכשלה — נופלים חזרה ל-debug כדי שיהיה APK"
            gradle assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk routines.apk
          fi

      - name: Build debug
        if: steps.ks.outputs.signed != 'true'
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk routines.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "שגרות — בילד אחרון"
          files: routines.apk
          make_latest: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: routines-apk
          path: routines.apk
